<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Voice Jump — Shout to Survive</title>
<style>
  :root{
    --panel-bg: rgba(15, 23, 42, 0.88);
    --text: #f8fafc;
    --accent: #ff6b6b;
    --accent-2: #4d61fc;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background:#0f172a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #game-wrap{
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);
  }
  #stage{
    position:relative;
    width:100%; max-width:900px;
    aspect-ratio: 16 / 9;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    background:linear-gradient(#8ecae6, #d8f3ff);
    touch-action:none;
    user-select:none;
  }
  canvas{ display:block; width:100%; height:100%; }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none;
    font-weight:700; color:#0f172a;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }
  #score-box{ font-size:clamp(18px,3vw,26px); }
  #mic-wrap{ text-align:right; }
  #mic-meter{
    width:130px; height:14px; border-radius:8px;
    background:rgba(15,23,42,0.18);
    overflow:hidden; position:relative;
    border:1px solid rgba(15,23,42,0.3);
  }
  #mic-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg,#34d399,#fbbf24,#f87171);
  }
  #mic-threshold{
    position:absolute; top:-3px; bottom:-3px; width:2px; left:20%;
    background:#0f172a;
  }
  #mic-label{ font-size:11px; margin-top:4px; opacity:0.75; }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(2,6,23,0.55);
    backdrop-filter: blur(4px);
    text-align:center; padding:20px;
  }
  .card{
    background:var(--panel-bg); color:var(--text);
    padding:32px 28px; border-radius:18px;
    max-width:420px; width:100%;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
  }
  .card h1{ margin:0 0 8px; font-size:26px; }
  .card p{ margin:6px 0 18px; font-size:14px; line-height:1.55; opacity:0.88; }
  .btn{
    border:none; cursor:pointer;
    padding:14px 26px; font-size:16px; font-weight:700;
    border-radius:12px; color:#fff;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    box-shadow:0 8px 20px rgba(77,97,252,0.4);
    transition:transform 0.15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .hint{ font-size:12px; margin-top:14px; opacity:0.65; }
  #error-msg{ color:#fca5a5; font-size:13px; margin-top:10px; display:none; }
  #final-score{ font-size:42px; font-weight:800; margin:4px 0; color:#fbbf24; }
  #best-score{ font-size:13px; opacity:0.8; margin-bottom:18px; }
  .hidden{ display:none !important; }

  @media (max-width:480px){
    .card{ padding:24px 18px; }
    .card h1{ font-size:22px; }
    #mic-meter{ width:90px; }
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score-box">Score: <span id="score">0</span></div>
      <div id="mic-wrap">
        <div id="mic-meter"><div id="mic-fill"></div><div id="mic-threshold"></div></div>
        <div id="mic-label">MIC LEVEL</div>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="card">
        <h1>🎤 Voice Jump</h1>
        <p>Run forever, jump with your voice. Stay quiet to walk — <b>shout or sing a high note</b> to leap over obstacles. The louder / higher you go, the higher you jump!</p>
        <button class="btn" id="start-btn">Start Game &amp; Allow Mic</button>
        <div id="error-msg"></div>
        <div class="hint">No mic access? Press <b>Space</b> or tap the screen to jump instead.</div>
      </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <div class="card">
        <h1>💥 Game Over</h1>
        <div id="final-score">0</div>
        <div id="best-score">Best: 0</div>
        <button class="btn" id="retry-btn">Play Again</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============================ CANVAS SETUP ============================ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  const LOGICAL_W = 800;
  const LOGICAL_H = 450;
  const GROUND_Y = 360;
  const PLAYER_X = 130;

  function fitCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* ============================== DOM REFS =============================== */
  const scoreEl = document.getElementById('score');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const errorMsg = document.getElementById('error-msg');
  const finalScoreEl = document.getElementById('final-score');
  const bestScoreEl = document.getElementById('best-score');
  const micFill = document.getElementById('mic-fill');
  const micThresholdEl = document.getElementById('mic-threshold');

  /* ========================= TUNABLE GAME CONSTANTS ======================= */
  const GRAVITY = 0.55;
  const BASE_JUMP = 8.0;        // minimum jump power once volume clears threshold
  const MAX_JUMP_BONUS = 5.4;   // extra power added for very loud / high-pitched sounds
  const MANUAL_JUMP_POWER = BASE_JUMP + MAX_JUMP_BONUS * 0.55; // keyboard/tap fallback

  const PITCH_MIN_HZ = 160;     // below this = no pitch bonus
  const PITCH_MAX_HZ = 900;     // at/above this = full pitch bonus
  const DISPLAY_MAX_VOL = 0.5;  // raw RMS value that fills the mic meter to 100%
  const CALIBRATION_FRAMES = 45; // ~0.75s @60fps of "stay quiet" sampling

  const BASE_SPEED = 4.6;
  const MAX_SPEED = 9.5;
  const SCORE_RATE = 0.18;

  let HIGH_SCORE = Number(localStorage.getItem('voiceJumpHighScore') || 0);

  /* ================================ STATE ================================= */
  let state = 'idle'; // idle | playing | gameover
  let score = 0;
  let speed = BASE_SPEED;
  let obstacles = [];
  let spawnTimer = 60;
  let lastTime = 0;
  let runCycle = 0;
  let groundScroll = 0;

  let calibrating = true;
  let calibrationSamples = [];
  let calibrationFramesLeft = CALIBRATION_FRAMES;
  let noiseFloor = 0.02;
  let jumpThreshold = 0.12;

  const player = { y: GROUND_Y, vy: 0, onGround: true, squash: 0 };

  const clouds = [
    { x: 100, y: 60, r: 22 }, { x: 320, y: 40, r: 16 },
    { x: 560, y: 80, r: 20 }, { x: 720, y: 50, r: 14 }
  ];

  /* ================================ AUDIO ================================= */
  let audioCtx = null, analyser = null;
  let timeData = null, freqData = null;
  let currentVolume = 0;
  let currentPitchScore = 0;
  let micReady = false;

  async function initMic(){
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.35;
    source.connect(analyser); // never connect to destination -> avoids feedback/echo
    timeData = new Uint8Array(analyser.fftSize);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
  }

  function readAudio(){
    if(!micReady) return;

    // --- Volume via RMS of the time-domain waveform ---
    analyser.getByteTimeDomainData(timeData);
    let sumSq = 0;
    for(let i=0;i<timeData.length;i++){
      const v = (timeData[i]-128)/128;
      sumSq += v*v;
    }
    currentVolume = Math.sqrt(sumSq/timeData.length);

    // --- Approximate pitch: frequency bin with strongest energy ---
    analyser.getByteFrequencyData(freqData);
    let maxVal = 0, maxIdx = 0;
    for(let i=0;i<freqData.length;i++){
      if(freqData[i] > maxVal){ maxVal = freqData[i]; maxIdx = i; }
    }
    let pitchScore = 0;
    if(maxVal > 40){
      const freq = maxIdx * audioCtx.sampleRate / analyser.fftSize;
      pitchScore = (freq - PITCH_MIN_HZ) / (PITCH_MAX_HZ - PITCH_MIN_HZ);
      pitchScore = Math.max(0, Math.min(1, pitchScore));
    }
    currentPitchScore = pitchScore;

    micFill.style.width = Math.min(100, (currentVolume/DISPLAY_MAX_VOL)*100).toFixed(0) + '%';
  }

  function setThresholdMarker(){
    micThresholdEl.style.left = Math.min(100, (jumpThreshold/DISPLAY_MAX_VOL)*100) + '%';
  }
  setThresholdMarker();

  /* ================================ INPUT ================================= */
  function manualJump(){
    if(state !== 'playing' || calibrating) return;
    if(player.onGround){
      player.vy = -MANUAL_JUMP_POWER;
      player.onGround = false;
    }
  }
  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){ e.preventDefault(); manualJump(); }
  });
  stage.addEventListener('pointerdown', () => { manualJump(); });

  function triggerVoiceJump(){
    const headroom = Math.max(0.001, DISPLAY_MAX_VOL*1.6 - jumpThreshold);
    const excess = Math.max(0, Math.min(1, (currentVolume - jumpThreshold) / headroom));
    const combined = Math.min(1, excess*0.65 + currentPitchScore*0.35);
    player.vy = -(BASE_JUMP + combined*MAX_JUMP_BONUS);
    player.onGround = false;
  }

  /* ============================= GAME LOGIC ================================ */
  function spawnObstacle(){
    const type = Math.random() < 0.5 ? 'spike' : 'block';
    let width, height;
    if(type === 'spike'){ width = 26; height = 34 + Math.random()*18; }
    else { width = 30 + Math.random()*20; height = 46 + Math.random()*40; }
    obstacles.push({ x: LOGICAL_W + 20, width, height, type });
  }

  function resetGame(){
    score = 0;
    obstacles = [];
    spawnTimer = 70;
    speed = BASE_SPEED;
    player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.squash = 0;
    runCycle = 0;

    calibrating = true;
    calibrationSamples = [];
    calibrationFramesLeft = CALIBRATION_FRAMES;
    jumpThreshold = 0.12;
    setThresholdMarker();

    scoreEl.textContent = '0';
    gameoverOverlay.classList.add('hidden');
    state = 'playing';
  }

  function gameOver(){
    state = 'gameover';
    const finalScore = Math.floor(score);
    HIGH_SCORE = Math.max(HIGH_SCORE, finalScore);
    localStorage.setItem('voiceJumpHighScore', String(HIGH_SCORE));
    finalScoreEl.textContent = finalScore;
    bestScoreEl.textContent = 'Best: ' + HIGH_SCORE;
    gameoverOverlay.classList.remove('hidden');
  }

  function updateClouds(factor){
    for(const c of clouds){
      c.x -= 0.35*factor;
      if(c.x < -40) c.x = LOGICAL_W + 40;
    }
  }

  function update(factor){
    // --- Calibration: sample ambient noise so the threshold adapts to the room/mic ---
    if(calibrating){
      calibrationSamples.push(currentVolume);
      calibrationFramesLeft -= factor;
      if(calibrationFramesLeft <= 0){
        const avg = calibrationSamples.reduce((a,b)=>a+b,0) / Math.max(1,calibrationSamples.length);
        noiseFloor = avg;
        jumpThreshold = Math.min(0.4, Math.max(0.09, noiseFloor + 0.09));
        setThresholdMarker();
        calibrating = false;
      }
    } else {
      if(player.onGround && !micReady === false && currentVolume > jumpThreshold){
        triggerVoiceJump();
      }
    }

    // --- Physics ---
    player.vy += GRAVITY * factor;
    player.y += player.vy * factor;
    if(player.y >= GROUND_Y){
      if(!player.onGround) player.squash = 1;
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    }
    if(player.squash > 0) player.squash = Math.max(0, player.squash - 0.08*factor);

    // --- Ground / run animation ---
    groundScroll = (groundScroll + speed*factor) % 40;
    if(player.onGround) runCycle += factor*0.25;

    if(!calibrating){
      // --- Difficulty ramp ---
      speed = Math.min(MAX_SPEED, BASE_SPEED + score*0.004);

      // --- Obstacles ---
      spawnTimer -= factor;
      if(spawnTimer <= 0){
        spawnObstacle();
        const minGap = Math.max(55, 95 - score*0.05);
        spawnTimer = minGap + Math.random()*40;
      }
      for(let i=obstacles.length-1;i>=0;i--){
        obstacles[i].x -= speed*factor;
        if(obstacles[i].x + obstacles[i].width < -20) obstacles.splice(i,1);
      }

      // --- Collision (AABB with small inward padding for fairness) ---
      const pad = 5;
      const pLeft = PLAYER_X - 13 + pad, pRight = PLAYER_X + 13 - pad;
      const pTop = player.y - 80 + pad, pBottom = player.y - 2;
      for(const o of obstacles){
        const oTop = GROUND_Y - o.height;
        if(pRight > o.x + 3 && pLeft < o.x + o.width - 3 &&
           pBottom > oTop + 3 && pTop < GROUND_Y){
          gameOver();
          return;
        }
      }

      // --- Score ---
      score += factor * SCORE_RATE;
      scoreEl.textContent = Math.floor(score);
    }
  }

  /* =============================== RENDERING =============================== */
  function drawClouds(){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for(const c of clouds){
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
      ctx.arc(c.x + c.r*0.9, c.y+4, c.r*0.7, 0, Math.PI*2);
      ctx.arc(c.x - c.r*0.9, c.y+6, c.r*0.6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawGround(){
    ctx.fillStyle = '#3f7d3a';
    ctx.fillRect(0, GROUND_Y-6, LOGICAL_W, 6);
    ctx.fillStyle = '#5b3a29';
    ctx.fillRect(0, GROUND_Y, LOGICAL_W, LOGICAL_H-GROUND_Y);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for(let x=-groundScroll; x<LOGICAL_W; x+=40){
      ctx.moveTo(x, GROUND_Y+14);
      ctx.lineTo(x+18, GROUND_Y+14);
    }
    ctx.stroke();
  }

  function drawObstacles(){
    for(const o of obstacles){
      if(o.type === 'spike'){
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(o.x, GROUND_Y);
        ctx.lineTo(o.x + o.width/2, GROUND_Y - o.height);
        ctx.lineTo(o.x + o.width, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#457b9d';
        roundRect(o.x, GROUND_Y - o.height, o.width, o.height, 6);
        ctx.fill();
      }
    }
  }

  function drawLimb(x,y,angle,len){
    const ex = x + Math.sin(angle)*len*0.6;
    const ey = y + Math.cos(angle)*len;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(ex,ey);
    ctx.stroke();
  }

  function drawPlayer(){
    const by = player.y;
    const squashScale = 1 - player.squash*0.18;
    ctx.save();
    ctx.translate(PLAYER_X, by);
    ctx.scale(1, squashScale);
    ctx.translate(-PLAYER_X, -by);

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';

    const legA = player.onGround ? Math.sin(runCycle)*0.55 : -0.35;
    const legB = player.onGround ? Math.sin(runCycle+Math.PI)*0.55 : 0.6;
    const armA = player.onGround ? Math.sin(runCycle+Math.PI)*0.5 : -0.9;
    const armB = player.onGround ? Math.sin(runCycle)*0.5 : 0.9;

    const hipX = PLAYER_X, hipY = by-30;
    const shX = PLAYER_X, shY = by-58;
    const headY = by-70;

    drawLimb(hipX,hipY, legB, 30);
    drawLimb(shX,shY, armB, 22);

    ctx.beginPath();
    ctx.moveTo(shX,shY);
    ctx.lineTo(hipX,hipY);
    ctx.stroke();

    drawLimb(hipX,hipY, legA, 30);
    drawLimb(shX,shY, armA, 22);

    ctx.beginPath();
    ctx.fillStyle = '#1e293b';
    ctx.arc(PLAYER_X, headY, 11, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
    drawClouds();
    drawGround();
    drawObstacles();
    drawPlayer();

    if(state === 'playing' && calibrating){
      ctx.fillStyle = 'rgba(15,23,42,0.75)';
      roundRect(LOGICAL_W/2-140, 30, 280, 40, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '600 15px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Get ready… calibrating mic (stay quiet)', LOGICAL_W/2, 55);
      ctx.textAlign = 'left';
    }
  }

  /* ================================ MAIN LOOP ============================== */
  function loop(timestamp){
    if(!lastTime) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    dt = Math.min(dt, 40);
    const factor = dt / (1000/60);

    readAudio();
    updateClouds(factor);
    if(state === 'playing') update(factor);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.addEventListener('visibilitychange', () => { lastTime = 0; });

  /* =============================== UI HANDLERS ============================== */
  async function handleStart(){
    startBtn.disabled = true;
    errorMsg.style.display = 'none';
    try{
      if(!micReady) await initMic();
      if(audioCtx.state === 'suspended') await audioCtx.resume();
    }catch(err){
      console.error(err);
      errorMsg.textContent = 'Microphone access failed (' + (err.message || err) +
        '). Make sure you are on HTTPS and allow mic permissions — you can still play with Space or taps.';
      errorMsg.style.display = 'block';
    }finally{
      startBtn.disabled = false;
      startOverlay.classList.add('hidden');
      resetGame();
    }
  }

  startBtn.addEventListener('click', handleStart);
  retryBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
